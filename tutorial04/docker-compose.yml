version: '3.8'

services:
  # Base de datos PostgreSQL
  db:
    image: postgres:15
    volumes:
      # Persistencia: los datos sobreviven aunque se apague el contenedor
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=tienda_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret_password

  # API Django
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      # Hot-reload: refleja cambios de código sin reconstruir
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      # Deben coincidir con lo que espera settings.py
      - DB_NAME=tienda_db
      - DB_USER=postgres
      - DB_PASSWORD=secret_password
      - DB_HOST=db        # nombre del servicio de la BD en la red de Docker
      - DB_PORT=5432

volumes:
  postgres_data:
