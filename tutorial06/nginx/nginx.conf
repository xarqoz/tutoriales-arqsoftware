# nginx/nginx.conf — El cerebro del ruteo (Strangler Pattern)

upstream django_v1 {
    server web_django:8000;
}

upstream flask_v2 {
    server pagos_flask:5000;
}

# Formato de log personalizado para EVIDENCIAR el estrangulamiento.
# $upstream_addr muestra el backend real al que Nginx reenvió la petición:
#   ...:8000  -> Django (v1)
#   ...:5000  -> Flask  (v2)
log_format strangler '$remote_addr "$request" status=$status '
                     '-> upstream=$upstream_addr '
                     '[$upstream_response_time s]';

server {
    listen 80;

    # Activamos el formato personalizado para este servidor.
    access_log /var/log/nginx/access.log strangler;

    location = /favicon.ico { access_log off; log_not_found off; }

    # RUTA NUEVA (v2): estrangulamos la función de compra y la mandamos a Flask.
    # Debe ir ANTES de /api/v1/ y de / para que tenga prioridad el prefijo v2.
    location /api/v2/comprar {
        proxy_pass http://flask_v2;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # RUTA VIEJA (v1): sigue yendo al monolito Django.
    location /api/v1/ {
        proxy_pass http://django_v1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Resto del tráfico (HTML, admin, etc.) también va a Django.
    location / {
        proxy_pass http://django_v1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }
}
