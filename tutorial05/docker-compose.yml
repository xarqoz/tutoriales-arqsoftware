services:
  # Base de datos PostgreSQL
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=tienda_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tienda_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend Django servido por Gunicorn (ya NO con runserver)
  web:
    build: .
    # CAMBIO 1: Gunicorn en lugar de runserver.
    # 'Tienda' es el paquete del proyecto donde está wsgi.py
    command: gunicorn Tienda.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_NAME=tienda_db
      - DB_USER=postgres
      - DB_PASSWORD=secret_password
      - DB_HOST=db
      - DB_PORT=5432
    # NOTA: ya NO hay sección 'ports'. Django queda aislado del exterior;
    # solo Nginx puede hablar con él por la red interna de Docker.

  # CAMBIO 2: Nginx como Proxy Inverso. Único que da la cara a internet.
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      # Inyectamos nuestra configuración dentro del contenedor
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

volumes:
  postgres_data:
